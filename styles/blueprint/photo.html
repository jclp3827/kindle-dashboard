<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><style>
{{ css|safe }}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}
.photo-wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
.photo-wrap img{max-width:100%;max-height:100%;object-fit:contain;}
.footer{position:fixed;bottom:0;left:0;right:0;padding:4px 10px;font-size:11px;display:flex;justify-content:space-between;color:#999;background:rgba(255,255,255,0.8);}
</style></head><body>
<div class="photo-wrap">
{% if photo and photo.data %}
<img src="data:image/png;base64,{{ photo.data }}" alt=""/>
{% else %}
<div style="color:#999;font-size:20px;">无照片</div>
{% endif %}
</div>
{% if photo and photo.caption %}
<div class="footer"><span>{{ photo.caption }}</span><span>{{ page_no }} / {{ page_total }}</span></div>
{% endif %}
</body></html>
