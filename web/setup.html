<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Dashboard · 设置</title>
<style>
  :root{--bg:#f5f5f4;--card:#fff;--ink:#1c1917;--ink2:#57534e;--ink3:#a8a29e;--line:#e7e5e4;--accent:#1c1917;--ok:#16a34a;--err:#dc2626;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;}
  header h1{font-size:18px;margin:0;font-weight:800;}
  header .sec-note{font-size:12px;color:var(--ink3);}
  header .spacer{flex:1;}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button:active{transform:translateY(1px);}
  #status{font-size:12px;color:var(--ink2);}
  main{display:grid;grid-template-columns:1fr 420px;gap:24px;padding:24px;max-width:1280px;margin:0 auto;align-items:start;}
  @media(max-width:920px){main{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
  .card h2{font-size:15px;margin:0 0 4px;font-weight:800;}
  .card .help{font-size:12px;color:var(--ink3);margin-bottom:14px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;}
  .field .fhelp{font-size:11px;color:var(--ink3);margin-top:3px;}
  .field input[type=text],.field input[type=password],.field input[type=number],.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fafaf9;}
  .field.inline{display:flex;align-items:center;gap:8px;}
  .field.inline label{margin:0;}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--line);color:var(--ink2);margin-left:6px;}
  .badge.on{background:#dcfce7;color:#15803d;}
  .machine{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fafaf9;}
  .machine .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;user-select:none;background:#fff;}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .preview{position:sticky;top:78px;}
  .preview .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .preview .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .preview .frame{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .preview img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;}
  .preview .ctl{display:flex;gap:8px;align-items:center;margin:10px 0;}
  .secnote{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12px;border-radius:8px;padding:8px 12px;margin-bottom:14px;}
  .errbox{background:#fef2f2;border:1px solid #fecaca;color:var(--err);font-size:12px;border-radius:8px;padding:8px 12px;margin-bottom:14px;white-space:pre-line;display:none;}
  .add-disc{font-size:12px;color:var(--ink2);margin-top:8px;}
  .wizard{margin-bottom:14px;}
  .wizard h2{display:flex;align-items:center;gap:8px;}
  .wizard .wstep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fafaf9;}
  .wizard .wstep .st-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .wizard .wstep .st-title{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;}
  .wizard .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#d1d5db;flex:none;}
  .wizard .dot.ok{background:#16a34a;}
  .wizard .dot.bad{background:#dc2626;}
  .wizard .dot.wait{background:#f59e0b;}
  .wizard .st-detail{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.5;}
  .wizard button{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap;}
  .wizard button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .wizard button:disabled{opacity:.5;cursor:default;}
  .wizard .src-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;font-size:12px;margin-top:6px;}
  .wizard .src-item{display:flex;align-items:center;gap:6px;}
  .wizard .wtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .wizard .wtop .help{margin:0;}
  .wizard .wmsg{font-size:12px;margin-top:6px;padding:6px 9px;border-radius:7px;display:none;}
  .wizard .wmsg.show{display:block;}
  .wizard .wmsg.ok{background:#dcfce7;color:#15803d;}
  .wizard .wmsg.err{background:#fef2f2;color:#b91c1c;}
  .wizard .wmsg.info{background:#eff6ff;color:#1d4ed8;}
  .add-disc a{color:#2563eb;cursor:pointer;margin-right:10px;}
</style>
</head>
<body>
<header>
  <h1>Kindle Dashboard</h1><span class="sec-note" id="hdr-sec-note">设置</span>
  <span class="spacer"></span>
  <select id="lang-switch" onchange="switchLang(this.value)" style="font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;font-weight:600;">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <span id="status"></span>
  <button class="primary" id="btn-save" onclick="save()">保存</button>
</header>
<main>
  <div id="forms">
    <div class="secnote" id="hdr-secnote">🔒 你填的天气 Key / HA 令牌<b>只存本地</b>(config.yaml),不会上传任何服务器。</div>
    <div class="errbox" id="errbox"></div>
    <div id="form-body"></div>
  </div>
  <div class="preview">
    <div class="card wizard" id="wizard">
      <div class="wtop">
        <h2 style="margin:0;">系统向导</h2>
        <button onclick="sysCheck()">重新检测</button>
      </div>
      <div class="help" style="margin:0 0 8px;">按顺序完成下列步骤，Kindle 即可正常显示。</div>

      <div class="wstep" id="ws-nas">
        <div class="st-head">
          <div class="st-title"><span class="dot" id="dot-nas"></span>① NAS 照片库</div>
          <button id="btn-nas" onclick="sysMountNas()">挂载 NAS</button>
        </div>
        <div class="st-detail" id="detail-nas">检测中…</div>
      </div>

      <div class="wstep" id="ws-usb">
        <div class="st-head">
          <div class="st-title"><span class="dot" id="dot-usb"></span>② USB 网络（Kindle）</div>
          <button id="btn-usb" onclick="sysSetupUsb()">配置 USB 网络</button>
        </div>
        <div class="st-detail" id="detail-usb">检测中…</div>
      </div>

      <div class="wstep" id="ws-kindle">
        <div class="st-head">
          <div class="st-title"><span class="dot" id="dot-kindle"></span>③ Kindle 推送</div>
          <div style="display:flex;gap:6px;">
            <button id="btn-clear" onclick="sysClearScreen()">一键清屏</button>
            <button id="btn-kindle" onclick="sysTestKindle()">检测连接</button>
          </div>
        </div>
        <div class="st-detail" id="detail-kindle">检测中…</div>
      </div>

      <div class="wstep" id="ws-photo">
        <div class="st-head">
          <div class="st-title"><span class="dot" id="dot-photo"></span>④ 照片缓存</div>
          <button id="btn-photo" onclick="sysRestartPhoto()">重新加载</button>
        </div>
        <div class="st-detail" id="detail-photo">检测中…</div>
      </div>

      <div class="wstep">
        <div class="st-title" style="font-size:13px;">数据源</div>
        <div class="src-grid" id="src-grid"></div>
      </div>

      <div class="wmsg" id="wmsg"></div>
    </div>
    <div class="card">
      <h2 id="prev-title">实时预览</h2>
      <div class="help" id="prev-help">所见即所得 —— 切风格立即变;改配置点「保存」后刷新。</div>
      <div class="tabs" id="page-tabs"></div>
      <div class="ctl">
        <label id="prev-style-label">风格</label>
        <select id="style-sel" onchange="refreshPreview()" style="flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);"></select>
        <button id="prev-refresh" onclick="refreshPreview()">刷新</button>
      </div>
      <div class="frame"><img id="preview-img" alt="预览"></div>
    </div>
  </div>
</main>

<script src="/qrcode.js"></script>

if (KD_TOKEN) sessionStorage.setItem('kd_token', KD_TOKEN);
(function(of){ window.fetch = (u, o={}) => {
  o.headers = Object.assign({}, o.headers || {}, {'X-Access-Token': KD_TOKEN});
  return of(u, o);
}; })(window.fetch);

}

// 切换语言:只改 server.language,合并进当前 CONFIG 整体保存,然后重载(保留 token)。
async function switchLang(lang){
  if(!CONFIG.server) CONFIG.server={};
  CONFIG.server.language=lang;
  try{
    await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:CONFIG})});
  }catch(e){}
  if(new URLSearchParams(location.search).get('token')){
    location.reload();
  }else{
    const tok=sessionStorage.getItem('kd_token');
    location.href = tok ? (location.pathname+'?token='+encodeURIComponent(tok)) : location.href;
    if(!tok) location.reload();
  }
}

async function init(){
  const scR = await fetch('/api/schema');
  if(scR.status===401){   // 没带访问令牌:给明确提示,别把 401 JSON 当 schema 用导致空白/报错
    document.getElementById('form-body').innerHTML =
      '<div class="errbox" style="display:block">'+t('need_token')+'</div>';
    return;
  }
  const [sc, cf, st, dv, su] = await Promise.all([
    scR.json(),
    fetch('/api/config').then(r=>r.json()),
    fetch('/api/styles').then(r=>r.json()),
    fetch('/api/discovered-devices').then(r=>r.json()),
    fetch('/api/server-url').then(r=>r.json()).catch(()=>({recommended:window.location.origin,candidates:[window.location.origin],is_loopback:false})),
  ]);
  SCHEMA=sc; CONFIG=cf.config; STYLES=st.styles; PAGES=st.pages; DISCOVERED=dv.devices; SERVER_URL=su;
  LANG=(CONFIG.server && CONFIG.server.language) || 'zh';
  applyStaticI18n();
  renderForm(); renderPreviewControls(); updateStatus(cf.status);
}

function renderForm(){
  const root=document.getElementById('form-body'); root.innerHTML='';
  for(const sec of SCHEMA){
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<h2>${sec.label}<span class="badge" id="badge-${sec.key}"></span></h2>`+
                (sec.help?`<div class="help">${sec.help}</div>`:'');
    if(sec.key==='devices') c.appendChild(renderDevices(sec));
    else if(sec.key==='ha_page') c.appendChild(renderHaEntities(sec));
    else for(const f of sec.fields){ const n=renderField(sec.key,f); if(n) c.appendChild(n); }
    // devices/ha_page 用自定义列表控件,其标量字段(如 devices.interval)在列表后补渲染
    if(sec.key==='devices'||sec.key==='ha_page')
      for(const f of sec.fields){ if(f.type!=='module_list'){ const n=renderField(sec.key,f); if(n) c.appendChild(n); } }
    if(sec.key==='reminders') c.appendChild(internalCollectBox('internal_rem'));
    if(sec.key==='mstodo') c.appendChild(renderMstodo());
    if(sec.key==='ai_usage'){ c.appendChild(internalCollectBox('internal_ccusage')); c.appendChild(internalCollectBox('internal_quota')); }
    if(sec.key==='music') c.appendChild(internalCollectBox('internal_music'));
    if(sec.key==='server'){ c.appendChild(kindleFlashBox()); c.appendChild(renderAppQR()); }
    root.appendChild(c);
  }
  wireKindleModel();
}

// 机型下拉 ↔ 自定义宽高联动:选具体机型→自动回填横屏分辨率并锁定输入;选「自定义」→可手填。
// 映射表唯一数据源 = schema 的 kindle_model.options(每项 [value,label,w,h]),不在前端复制。
function wireKindleModel(){
  const sel=document.getElementById('f-server-kindle_model');
  const wEl=document.getElementById('f-server-render_width');
  const hEl=document.getElementById('f-server-render_height');
  if(!sel||!wEl||!hEl) return;
  const srv=(SCHEMA.find(s=>s.key==='server')||{}).fields||[];
  const opts=(srv.find(f=>f.key==='kindle_model')||{}).options||[];
  function apply(){
    const m=opts.find(o=>o[0]===sel.value);
    const custom=(sel.value==='custom');
    if(m && !custom){ wEl.value=m[2]; hEl.value=m[3]; }
    wEl.readOnly=hEl.readOnly=!custom;
    wEl.style.opacity=hEl.style.opacity=custom?'1':'0.55';
  }
  sel.addEventListener('change',apply);
  apply();
}

function renderField(sk,f){
  if(f.hidden) return null;   // 由配套控件维护(如城市名由城市选择器写入隐藏 input)
  const v=(CONFIG[sk]||{})[f.key];
  const d=document.createElement('div'); d.className='field'; const id=`f-${sk}-${f.key}`;
  const help=f.help?`<div class="fhelp">${f.help}</div>`:'';
  if(f.type==='city'){ return cityField(sk,f,v,help); }
  if(f.type==='printer'){ return printerField(sk,f,v,help); }
  if(sk==='display'&&f.key==='pages'){ return pageOrderField(sk,f,v,help); }
  if(sk==='display'&&f.key==='style'){ return styleField(sk,f,v,help); }
  if(sk==='display'&&f.key==='style_rotation'){ return choiceListField(sk,f,v,help,STYLES,styleLabel,t('empty_styles')); }
  if(f.type==='module_list'){ return moduleListField(sk,f,v,help); }
  if(f.type==='bool'){
    d.className='field inline';
    d.innerHTML=`<input type="checkbox" id="${id}" ${v?'checked':''}><label for="${id}">${f.label}</label>`+help;
  }else if(f.type==='enum'){
    const opts=(f.options||[]).map(o=>`<option value="${h(o[0])}" ${v===o[0]?'selected':''}>${h(o[1])}</option>`).join('');
    d.innerHTML=`<label>${f.label}</label><select id="${id}">${opts}</select>`+help;
  }else if(f.type==='int'||f.type==='float'){
    d.innerHTML=`<label>${f.label}</label><input type="number" id="${id}" value="${h(v??'')}" step="${f.type==='float'?'0.1':'1'}">`+help;
  }else if(f.type==='str_list'){
    d.innerHTML=`<label>${f.label}</label><input type="text" id="${id}" value="${h((v||[]).join(', '))}" placeholder="${h(t('ph_comma'))}">`+help;
  }else if(f.secret){
    d.innerHTML=`<label>${f.label} 🔑</label><input type="password" id="${id}" value="${v===MASK?MASK:''}" placeholder="${v===MASK?h(t('ph_saved')):''}">`+help;
  }else{
    d.innerHTML=`<label>${f.label}</label><input type="text" id="${id}" value="${h(v??'')}">`+help;
  }
  return d;
}

// 通用 module_list 编辑器(下载器 clients / 资讯 feeds 等;devices/ha_page 用各自专属编辑器,不走这里)。
// 每项一张卡片,内联渲染 item_fields(enum→下拉、bool→开关、secret→密码…);可添加/删除。
function moduleListItemControl(itf,val){
  const cls=`mf-${h(itf.key)}`;
  const lab=`<label style="font-size:12px;color:var(--ink2);margin-bottom:2px;display:block;">${itf.label}${itf.required?' *':''}</label>`;
  const fhelp=itf.help?`<div class="fhelp">${itf.help}</div>`:'';
  if(itf.hidden){ return `<input type="hidden" class="${cls}" value="${h(val??itf.default??'')}">`; }
  let ctrl;
  if(itf.type==='enum'){
    const opts=(itf.options||[]).map(o=>`<option value="${h(o[0])}" ${(val??itf.default)===o[0]?'selected':''}>${h(o[1])}</option>`).join('');
    ctrl=`<select class="${cls}">${opts}</select>`;
  }else if(itf.type==='bool'){
    ctrl=`<input type="checkbox" class="${cls}" ${val?'checked':''}>`;
  }else if(itf.type==='int'||itf.type==='float'){
    ctrl=`<input type="number" class="${cls}" value="${h(val??itf.default??'')}" step="${itf.type==='float'?'0.1':'1'}">`;
  }else if(itf.secret){
    ctrl=`<input type="password" class="${cls}" value="${val===MASK?MASK:''}" placeholder="${val===MASK?h(t('ph_saved')):''}">`;
  }else{
    ctrl=`<input type="text" class="${cls}" value="${h(val??'')}">`;
  }
  return `<div class="mfield" style="margin-bottom:8px;">${itf.type==='bool'?'':lab}${itf.type==='bool'?`<label class="inline" style="display:flex;align-items:center;gap:7px;">${ctrl}<span>${itf.label}</span></label>`:ctrl}${fhelp}</div>`;
}
function moduleListField(sk,f,v,help){
  const d=document.createElement('div'); d.className='field';
  d.innerHTML=`<label>${f.label}</label>`+help;
  const list=document.createElement('div'); list.className='mlist'; list.dataset.sk=sk; list.dataset.key=f.key;
  const itf=f.item_fields||[];
  function addItem(item){
    const card=document.createElement('div'); card.className='mitem';
    card.style.cssText='border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fafaf9;';
    card.innerHTML=itf.map(x=>moduleListItemControl(x, item?item[x.key]:undefined)).join('')
      +`<button type="button" class="mitem-del" style="font-size:13px;color:var(--err);padding:3px 10px;">${t('ml_del')}</button>`;
    card.querySelector('.mitem-del').onclick=()=>card.remove();
    list.appendChild(card);
  }
  (Array.isArray(v)?v:[]).forEach(addItem);
  d.appendChild(list);
  const add=document.createElement('button'); add.type='button'; add.textContent=t('ml_add');
  add.style.cssText='font-size:13px;padding:6px 12px;';
  add.onclick=()=>addItem(null);
  d.appendChild(add);
  return d;
}
function collectModuleList(sk,f){
  const list=document.querySelector(`.mlist[data-sk="${sk}"][data-key="${f.key}"]`);
  if(!list) return ((CONFIG[sk]||{})[f.key])||[];   // 没渲染(理论不会)→ 保留原值,别清空
  const itf=f.item_fields||[]; const rows=[];
  list.querySelectorAll('.mitem').forEach(card=>{
    const obj={};
    for(const x of itf){
      const el=card.querySelector(`.mf-${CSS.escape(x.key)}`); if(!el) continue;
      if(x.type==='bool') obj[x.key]=el.checked;
      else if(x.type==='int') obj[x.key]=parseInt(el.value||'0',10);
      else if(x.type==='float') obj[x.key]=parseFloat(el.value||'0');
      else if(x.secret){ if(el.value&&el.value!==MASK) obj[x.key]=el.value; }   // 留空/掩码=不改,后端按名回填
      else obj[x.key]=el.value;
    }
    const keyf=itf[0];   // 第一个必填字段(如 name)空 → 整项跳过
    if(keyf && !String(obj[keyf.key]??'').trim()) return;
    rows.push(obj);
  });
  return rows;
}

function styleField(sk,f,v,help){
  const d=document.createElement('div'); d.className='field';
  const opts=STYLES.map(s=>`<option value="${h(s)}" ${v===s?'selected':''}>${h(styleLabel(s))}</option>`).join('');
  d.innerHTML=`<label>${f.label}</label><select id="f-${sk}-${f.key}">${opts}</select>`+help;
  return d;
}

function choiceListField(sk,f,v,help,choices,labelFn,emptyText){
  const d=document.createElement('div'); d.className='field';
  const sel=new Set(Array.isArray(v)?v:[]);
  const chips=choices.map(k=>`<span class="chip ${sel.has(k)?'on':''}" data-v="${h(k)}">${h(labelFn(k))}</span>`).join('');
  d.innerHTML=`<label>${f.label}</label><input type="hidden" id="f-${sk}-${f.key}" value="${h([...sel].join(', '))}">
    <div class="chips">${chips}</div>
    <div class="fhelp choice-empty">${h(sel.size?t('selected_n')(sel.size):emptyText)}</div>`+help;
  const hid=d.querySelector(`#f-${sk}-${f.key}`);
  const note=d.querySelector('.choice-empty');
  function sync(){
    const vals=[...d.querySelectorAll('.chip.on')].map(c=>c.dataset.v);
    hid.value=vals.join(', ');
    note.textContent=vals.length?t('selected_n')(vals.length):emptyText;
  }
  d.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ c.classList.toggle('on'); sync(); });
  return d;
}

// 页面顺序 + 开关:↑/↓ 调翻页顺序;每行复选框关掉不想要的页(写进 hidden_pages,即使有数据也不显示)。
// 列出全部页,已存顺序在前、其余补后。两个隐藏 input(pages=顺序 / hidden_pages=关闭项),保存按 str_list 收。
function pageOrderField(sk,f,v,help){
  const d=document.createElement('div'); d.className='field';
  const valid=PAGES.slice();
  const saved=(Array.isArray(v)?v:[]).filter(k=>valid.includes(k));
  const ordered=saved.concat(valid.filter(k=>!saved.includes(k)));
  const hidden0=((CONFIG.display||{}).hidden_pages||[]).filter(k=>valid.includes(k));
  const rowStyle="display:flex;justify-content:space-between;align-items:center;padding:7px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fafaf9;";
  const btn="font-size:14px;padding:2px 10px;line-height:1.2;";
  const rows=ordered.map(k=>`<div class="porow" data-v="${h(k)}" style="${rowStyle}">
      <span style="font-weight:600;"><input type="checkbox" class="pen" ${hidden0.includes(k)?'':'checked'} style="margin-right:9px;vertical-align:middle;cursor:pointer;">${h(pageLabel(k))}</span>
      <span><button type="button" class="pup" title="${h(t('ha_move_up'))}" style="${btn}">↑</button>
        <button type="button" class="pdn" title="${h(t('ha_move_down'))}" style="${btn}">↓</button></span>
    </div>`).join('');
  d.innerHTML=`<label>${f.label}</label>
    <input type="hidden" id="f-${sk}-${f.key}" value="${h(ordered.join(', '))}">
    <input type="hidden" id="f-${sk}-hidden_pages" value="${h(hidden0.join(', '))}">
    <div class="porder">${rows}</div>`+help;
  const hid=d.querySelector(`#f-${sk}-${f.key}`);
  const hidH=d.querySelector(`#f-${sk}-hidden_pages`);
  const list=d.querySelector('.porder');
  function paint(row){ row.style.opacity=row.querySelector('.pen').checked?'':'.45'; }
  function sync(){
    const rs=[...list.querySelectorAll('.porow')];
    hid.value=rs.map(r=>r.dataset.v).join(', ');
    hidH.value=rs.filter(r=>!r.querySelector('.pen').checked).map(r=>r.dataset.v).join(', ');
  }
  list.querySelectorAll('.porow').forEach(row=>{
    row.querySelector('.pup').onclick=()=>{ const p=row.previousElementSibling; if(p){ list.insertBefore(row,p); sync(); } };
    row.querySelector('.pdn').onclick=()=>{ const n=row.nextElementSibling; if(n){ list.insertBefore(n,row); sync(); } };
    row.querySelector('.pen').onchange=()=>{ paint(row); sync(); };
    paint(row);
  });
  return d;
}

// 打印机选择器:从 Home Assistant 扫描候选打印机,选中后保存其公共实体前缀。
function printerField(sk,f,v,help){
  const d=document.createElement('div'); d.className='field';
  d.innerHTML=`<label>${f.label}</label>
    <div style="display:flex;gap:6px;">
      <select class="printer-sel" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafaf9;">
        <option value="${h(v||'')}">${h(v?(t('printer_current')+v):t('printer_scan_first'))}</option>
      </select>
      <button type="button" class="printer-scan" style="white-space:nowrap;">${h(t('printer_scan'))}</button>
    </div>
    <input type="hidden" id="f-${sk}-${f.key}" value="${h(v||'')}">
    <details style="margin-top:6px;"><summary style="font-size:12px;color:var(--ink3);cursor:pointer;">${h(t('printer_adv'))}</summary>
      <input type="text" class="printer-prefix" value="${h(v||'')}" placeholder="${h(t('printer_prefix_ph'))}" style="margin-top:5px;"></details>
    <div class="printer-results" style="margin-top:4px;"></div>`+help;
  const sel=d.querySelector('.printer-sel'), scan=d.querySelector('.printer-scan'),
        hid=d.querySelector(`#f-${sk}-${f.key}`), prefix=d.querySelector('.printer-prefix'),
        box=d.querySelector('.printer-results');
  function setVal(val){
    hid.value=val; prefix.value=val;
  }
  function label(p){
    const bits=[p.name||p.prefix, p.online?t('online'):t('offline')];
    if(p.status) bits.push(p.status);
    if(p.nozzle) bits.push(t('nozzle')+p.nozzle+'°');
    if(p.bed) bits.push(t('bed')+p.bed+'°');
    return bits.join(' · ');
  }
  async function doScan(){
    box.innerHTML=`<div class="aux" style="font-size:12px;">${h(t('printer_scanning'))}</div>`;
    let j; try{ j=await fetch('/api/printers').then(r=>r.json()); }
    catch(err){ box.innerHTML=`<div class="aux" style="font-size:12px;color:#b00;">${h(t('net_err'))}</div>`; return; }
    if(!j.ok){ box.innerHTML=`<div class="aux" style="font-size:12px;color:#b00;">${h(j.error||t('printer_scan_fail'))}</div>`; return; }
    if(!j.printers.length){ box.innerHTML=`<div class="aux" style="font-size:12px;">${h(t('printer_none'))}</div>`; return; }
    sel.innerHTML=j.printers.map(p=>`<option value="${h(p.prefix)}" ${p.prefix===hid.value?'selected':''}>${h(label(p))}</option>`).join('');
    if(!hid.value || !j.printers.some(p=>p.prefix===hid.value)) setVal(j.printers[0].prefix);
    sel.value=hid.value;
    box.innerHTML=`<div class="aux" style="font-size:12px;color:var(--ink3);">${h(t('printer_found')(j.printers.length))}</div>`;
  }
  sel.onchange=()=>setVal(sel.value);
  scan.onclick=doScan;
  prefix.addEventListener('input',()=>{ hid.value=prefix.value.trim(); });
  return d;
}

// Microsoft To Do:设备码登录。点【连接】→ 显示 code+网址 → 轮询 → 已连接显示账号+断开。
// 用户不需要任何 API/密钥,只用自己的微软账号登录授权一次(详见 docs/mstodo-integration.md)。
function renderMstodo(){
  const wrap=document.createElement('div'); wrap.className='field';
  let poll=null;
  function render(st){
    if(poll){ clearInterval(poll); poll=null; }
    if(st&&st.connected){
      wrap.innerHTML=`<div class="fhelp" style="margin-bottom:8px;">${h(t('mst_connected'))}${st.account?((LANG==='en'?': <b>':':<b>')+h(st.account)+'</b>'):''}</div>
        <button type="button" class="mst-disc">${h(t('mst_disconnect'))}</button>`;
      wrap.querySelector('.mst-disc').onclick=async()=>{
        await fetch('/api/mstodo/logout',{method:'POST'});
        const cf=await fetch('/api/config').then(r=>r.json()); CONFIG=cf.config; updateStatus(cf.status);
        render({connected:false});
      };
    }else{
      wrap.innerHTML=`<div class="fhelp" style="margin-bottom:8px;">${h(t('mst_not_connected'))}</div>
        <button type="button" class="mst-conn primary">${h(t('mst_connect'))}</button>
        <div class="mst-flow" style="margin-top:10px;"></div>`;
      wrap.querySelector('.mst-conn').onclick=startLogin;
    }
  }
  async function startLogin(){
    const flow=wrap.querySelector('.mst-flow');
    flow.innerHTML=`<div class="fhelp">${h(t('mst_requesting'))}</div>`;
    let j; try{ j=await fetch('/api/mstodo/login/start',{method:'POST'}).then(r=>r.json()); }
    catch(e){ flow.innerHTML=`<div class="fhelp" style="color:#dc2626;">${h(t('mst_net_retry'))}</div>`; return; }
    if(!j.ok){ flow.innerHTML=`<div class="fhelp" style="color:#dc2626;">${h(j.error||t('mst_start_fail'))}</div>`; return; }
    flow.innerHTML=`<div style="background:#f4f4f4;border-radius:8px;padding:10px 12px;">
        <div class="fhelp" style="margin-bottom:6px;">${h(t('mst_step1a'))}<a href="${h(j.verification_uri)}" target="_blank">${h(j.verification_uri)}</a></div>
        <div class="fhelp" style="margin-bottom:6px;">${h(t('mst_step2'))}
          <code class="mst-code" style="user-select:all;font-size:14px;background:#fff;padding:2px 8px;border-radius:5px;cursor:pointer;">${h(j.user_code)}</code></div>
        <div class="fhelp">${h(t('mst_step3'))}</div>
        <div class="fhelp mst-wait" style="margin-top:6px;color:#2563eb;">${h(t('mst_waiting'))}</div>
      </div>`;
    const codeEl=flow.querySelector('.mst-code');
    codeEl.onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(j.user_code); codeEl.textContent=j.user_code+' ✓'; };
    const sid=j.session, every=Math.max(2,(j.interval||5))*1000;
    poll=setInterval(async()=>{
      let s; try{ s=await fetch('/api/mstodo/login/status?session='+encodeURIComponent(sid)).then(r=>r.json()); }catch(e){ return; }
      if(s.state==='success'){
        const cf=await fetch('/api/config').then(r=>r.json()); CONFIG=cf.config; updateStatus(cf.status);
        render({connected:true,account:s.account});
      }else if(s.state==='error'||s.state==='expired'){
        if(poll){ clearInterval(poll); poll=null; }
        flow.querySelector('.mst-wait').innerHTML=`<span style="color:#dc2626;">${h(s.state==='expired'?t('mst_expired'):(t('mst_login_fail')+(s.error||'')))}</span>`;
      }
    },every);
  }
  fetch('/api/mstodo/state').then(r=>r.json()).then(render).catch(()=>render({connected:false}));
  return wrap;
}

      <input type="text" class="city-code" value="${h(v||'')}" placeholder="${h(t('city_code_ph'))}" style="margin-top:5px;">
    </details>`+help;
  const q=d.querySelector('.city-q'), go=d.querySelector('.city-go'),
        box=d.querySelector('.city-results'), code=d.querySelector('.city-code'),
        hid=d.querySelector(`#f-${sk}-location`), hname=d.querySelector(`#f-${sk}-location_name`),
        curName=d.querySelector('.city-name'), curId=d.querySelector('.city-id');
  function pick(id,name){ hid.value=id; hname.value=name; code.value=id;
    curName.textContent=name||t('city_unselected'); curId.textContent=id?('· '+id):''; box.innerHTML=''; }
  async function doSearch(){
    const text=q.value.trim(); if(!text){ box.innerHTML=''; return; }
    box.innerHTML=`<div class="aux" style="font-size:12px;">${h(t('city_searching'))}</div>`;
    let j; try{ j=await fetch('/api/city-search?q='+encodeURIComponent(text)).then(r=>r.json()); }
    catch(e){ box.innerHTML=`<div class="aux" style="font-size:12px;color:#b00;">${h(t('net_err'))}</div>`; return; }
    if(!j.ok){ box.innerHTML=`<div class="aux" style="font-size:12px;color:#b00;">${h(j.error||t('city_search_fail'))}</div>`; return; }
    if(!j.results.length){ box.innerHTML=`<div class="aux" style="font-size:12px;">${h(t('city_no_match'))}</div>`; return; }
    box.innerHTML='';
    j.results.forEach(c=>{
      const b=document.createElement('button'); b.type='button';

      b.innerHTML=`<b>${h(c.name)}</b> <span class="aux" style="font-size:11px;">${h([c.adm2,c.adm1].filter(Boolean).join(' · '))}</span>`;
      b.onclick=()=>pick(c.id,c.name); box.appendChild(b);

  }
  go.onclick=doSearch;
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doSearch(); } });
  code.addEventListener('input',()=>{ hid.value=code.value.trim(); hname.value=''; // 手填编码:清城市名,采集时 GeoAPI 反查补上
    curName.textContent=t('city_manual'); curId.textContent=code.value.trim()?('· '+code.value.trim()):''; });
  return d;
}

// 远程机器「推」模式:展示一行命令,用户复制到那台机器(NAS/Linux/Mac)上运行即可装上 agent。
// 若设置页从 127.0.0.1/localhost 打开,命令里的看板地址用服务端探测到的局域网地址。
function normalizeBaseUrl(v){
  let s=String(v||'').trim().replace(/\/+$/,'');
  if(s && !/^https?:\/\//i.test(s)) s='http://'+s;
  return s;
}
function pushCmds(base){
  const u=normalizeBaseUrl(base||window.location.origin);
  const ps=u.replace(/'/g,"''");
  return {
    nix:`curl -fsSL ${u}/agent/install.sh | sh -s -- ${u} 30`,
    win:`$u='${ps}'; iwr "$u/agent/install.ps1" -UseBasicParsing -OutFile "$env:TEMP\\kda.ps1"; powershell -NoProfile -ExecutionPolicy Bypass -File "$env:TEMP\\kda.ps1" $u 30`,
    nixU:`curl -fsSL ${u}/agent/install.sh | sh -s -- uninstall`,
    winU:`$u='${ps}'; iwr "$u/agent/install.ps1" -UseBasicParsing -OutFile "$env:TEMP\\kda.ps1"; powershell -NoProfile -ExecutionPolicy Bypass -File "$env:TEMP\\kda.ps1" uninstall`
  };
}
function updatePushCmds(){
  const u=document.getElementById('push-url'); if(!u) return;
  const c=pushCmds(u.value);
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v; };
  set('push-nix',c.nix); set('push-win',c.win); set('push-nix-un',c.nixU); set('push-win-un',c.winU);
}
// Kindle 刷机命令:把「clone 仓库 + 用本看板地址刷 Kindle」做成一行,Mac/Win 复制即用。
// 地址用本看板的局域网地址(SERVER_URL 候选),所以 Kindle 拉图指的是这台服务器(NAS/Mac),不用手填 IP。
const KDASH_REPO='https://github.com/yizhixiaoheigou/kindle-dashboard.git';
function kindleCmds(url, kip){
  const u=normalizeBaseUrl(url)||window.location.origin;
  const ip=(kip||'').trim()||'192.168.15.244';   // 空=USB 默认地址;填了=WiFi 方式用路由器查到的 IP
  // 幂等:目录已存在就更新,不存在才 clone(否则 clone 撞到已有目录会直接报错)。
  const clone =`git clone ${KDASH_REPO} kindle-dashboard 2>/dev/null; cd kindle-dashboard && git pull --ff-only 2>/dev/null; `;
  const cloneW=`if (Test-Path kindle-dashboard) { git -C kindle-dashboard pull --ff-only } else { git clone ${KDASH_REPO} kindle-dashboard }; cd kindle-dashboard; `;
  return {
    nix:  clone +`sh installers/kindle/install.sh ${ip} ${u}`,
    win:  cloneW+`powershell -ExecutionPolicy Bypass -File installers\\kindle\\install.ps1 -KindleIp ${ip} -ServerUrl ${u}`,
    nixU: clone +`sh installers/kindle/uninstall.sh ${ip}`,
    winU: cloneW+`powershell -ExecutionPolicy Bypass -File installers\\kindle\\uninstall.ps1 -KindleIp ${ip}`
  };
}
function updateKindleCmds(){
  const u=document.getElementById('kindle-url'); if(!u) return;
  const kip=(document.getElementById('kindle-ip')||{}).value;
  const c=kindleCmds(u.value, kip);
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v; };
  set('kindle-nix',c.nix); set('kindle-win',c.win); set('kindle-nix-un',c.nixU); set('kindle-win-un',c.winU);
}

// 安卓 App 配置二维码:编码 {url, token},App 扫码免手敲 IP/令牌。二维码用本地内联库离线生成。
function buildAppQR(base){
  const box=document.getElementById('app-qr'); if(!box) return;
  const link=document.getElementById('app-link');
  const appUrl=base+'/app'+(KD_TOKEN?('?token='+encodeURIComponent(KD_TOKEN)):'');
  if(link){ link.value=appUrl; }
  const openBtn=document.getElementById('app-open'); if(openBtn){ openBtn.href=appUrl; }
  const payload=JSON.stringify({url:base, token:KD_TOKEN});
  try{
    const q=qrcode(0,'M'); q.addData(payload); q.make();
    box.innerHTML=q.createSvgTag(5,8);
    const svg=box.querySelector('svg'); if(svg){ svg.style.width='200px'; svg.style.height='200px'; svg.removeAttribute('width'); svg.removeAttribute('height'); }
  }catch(e){ box.innerHTML='<div class="fhelp" style="color:#b54;">'+(LANG==='en'?'QR generation failed':'二维码生成失败')+': '+h(String(e))+'</div>'; }
}

  const en=LANG==='en';
  const origin=window.location.origin;
  const recommended=normalizeBaseUrl((SERVER_URL&&SERVER_URL.recommended)||origin);

function copyCmd(id, ev){
  const el=document.getElementById(id);
  el.focus(); el.select(); try{ el.setSelectionRange(0, el.value.length); }catch(e){}
  const btn=ev&&ev.currentTarget;
  const done=()=>{ if(!btn) return; const prev=btn.textContent; btn.textContent=t('push_copied'); setTimeout(()=>btn.textContent=prev,1200); };
  // navigator.clipboard 只在 HTTPS / localhost 可用;局域网 HTTP 下它是 undefined,
  // 必须回退到 execCommand('copy')(配合上面已 select 的输入框)——否则点了没反应。
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).then(done).catch(()=>{ try{document.execCommand('copy');}catch(e){} done(); });
  }else{
    try{ document.execCommand('copy'); }catch(e){}
    done();
  }
}

const BASE_DEVICE_FIELDS=['cpu','mem','net','disk_io'];
function uniq(arr){
  const out=[];
  for(const x of arr){ if(x&&!out.includes(x)) out.push(x); }
  return out;
}
function deviceDiscoveryFor(m){
  const id=String(m.id||'').trim();
  const name=String(m.name||'').trim();
  let hit=DISCOVERED.find(d=>[d.key,d.hostname].includes(id) || [d.key,d.hostname].includes(name));
  if(!hit && (m.mode||'local')==='local'){
    const locals=DISCOVERED.filter(d=>!d.updated_at);
    if(locals.length===1) hit=locals[0];
  }
  return hit;
}
function machineFieldOptions(m){
  const hit=deviceDiscoveryFor(m);
  return uniq([...BASE_DEVICE_FIELDS, ...((hit&&hit.fields)||[]), ...((m.fields)||[])]);
}

function machineCard(m,idx){

// ---- 收集表单 ----
function collect(){
  const out={};
  for(const sec of SCHEMA){
    if(sec.key==='devices'||sec.key==='ha_page') continue;
    out[sec.key]={};
    for(const f of sec.fields){
      if(f.type==='module_list'){ out[sec.key][f.key]=collectModuleList(sec.key,f); continue; }
      const el=document.getElementById(`f-${sec.key}-${f.key}`); if(!el) continue;
      if(f.type==='bool') out[sec.key][f.key]=el.checked;
      else if(f.type==='int') out[sec.key][f.key]=parseInt(el.value||'0',10);
      else if(f.type==='float') out[sec.key][f.key]=parseFloat(el.value||'0');
      else if(f.type==='str_list') out[sec.key][f.key]=el.value.split(',').map(s=>s.trim()).filter(Boolean);
      else if(f.secret){ if(el.value&&el.value!==MASK) out[sec.key][f.key]=el.value; }
      else out[sec.key][f.key]=el.value;
    }
  }
  // 设备
  out.devices={machines:[]};
  document.querySelectorAll('#machines .machine').forEach(card=>{
    const g=s=>card.querySelector(s);
    const fields=[...card.querySelectorAll('.chip.on')].map(c=>c.dataset.f);
    const m={
      name:g('.m-name').value, id:g('.m-id').value, mode:g('.m-mode').value,
      platform:g('.m-platform').value,
      // 不勾任何项才存空(=全显示);只要勾了,就严格按勾选项显示。
      fields: fields.length===0?[]:fields,
    };
    if(m.name.trim()) out.devices.machines.push(m);
  });
  // 智能家居:每张卡片一个实体(没选 entity_id 的空卡片跳过)
  out.ha_page={entities:[]};
  document.querySelectorAll('#ha-entities .haent').forEach(card=>{
    const eid=card.querySelector('.he-id').value.trim();
    if(!eid) return;
    out.ha_page.entities.push({
      entity_id:eid,
      name:card.querySelector('.he-name').value.trim(),
      icon:card.querySelector('.he-icon').value.trim(),
    });
  });
  // devices/ha_page 段的标量字段(如 devices.interval)—— 列表控件没收集,这里补
  for(const sec of SCHEMA){
    if(sec.key!=='devices' && sec.key!=='ha_page') continue;
    for(const f of sec.fields){
      if(f.type==='module_list') continue;
      const el=document.getElementById(`f-${sec.key}-${f.key}`); if(!el) continue;
      out[sec.key][f.key] = f.type==='int' ? parseInt(el.value||'0',10)
                          : f.type==='bool' ? el.checked : el.value;
    }
  }
  return out;
}

async function save(){

  if(!j.ok){ eb.style.display='block'; eb.textContent=t('save_fail')+'\n'+j.errors.join('\n'); return; }

function markTabs(){document.querySelectorAll('#page-tabs button').forEach(b=>b.className=b.dataset.p===curPage?'on':'');}
function refreshPreview(){
  const style=document.getElementById('style-sel').value;
  const img=document.getElementById('preview-img');
  const base=`/kindle/preview.png?page=${curPage}&style=${style}&token=${encodeURIComponent(KD_TOKEN)}`;
  img.style.opacity='0.35';   // 渲染中变淡,出图后恢复
  let tries=0;
  (function load(){
    tries++;
    const probe=new Image();
    probe.onload=()=>{ img.src=probe.src; img.style.opacity='1'; };
    // 渲染串行化下偶发的超时/被占用 → 自动重试(最多 3 次,间隔递增),不再裂图
    probe.onerror=()=>{ if(tries<3){ setTimeout(load, 1200*tries); } else { img.style.opacity='1'; } };
    probe.src=`${base}&t=${Date.now()}&try=${tries}`;
  })();
}

async function sysApi(path, opts){

  try{ return await r.json(); }catch(e){ return {ok:false, error:'HTTP '+r.status}; }

async function sysCheck(){
  const s=await sysApi('/api/system/status');
  if(!s || s.ok===false){ wMsg('状态检测失败：'+(s&&s.error||'服务无响应'),'err'); return; }
  // NAS
  if(s.nas.mounted){
    setDot('dot-nas','ok');
    setDetail('dot-nas','');
    var cntTxt = s.nas.counting ? '正在统计照片数…' : '共 '+s.nas.photo_count.toLocaleString()+' 张照片';
    setDetail('detail-nas','已挂载 '+s.nas.mount+'，'+cntTxt);
    document.getElementById('btn-nas').textContent='重新挂载';
  }else{
    setDot('dot-nas', s.nas.host_reachable?'wait':'bad');
    setDetail('detail-nas', s.nas.host_reachable?'NAS 在线但未挂载，点右侧挂载':'NAS 不在线（请确认 NAS 已开机）');
    document.getElementById('btn-nas').textContent='挂载 NAS';
  }
  // USB
  if(!s.usbnet.exists){
    setDot('dot-usb','bad');
    setDetail('detail-usb','未检测到 en11 网卡（Kindle 未插或未开 USBNetwork）');
  }else if(s.usbnet.configured){
    setDot('dot-usb','ok');
    setDetail('detail-usb','en11 已配置 '+s.usbnet.ip);
  }else{
    setDot('dot-usb','wait');
    setDetail('detail-usb','en11 存在但未配置（当前 '+(s.usbnet.ip||'无IP')+'），点右侧授权配置');
  }
  // Kindle（以"正在拉帧"为最可靠信号）
  if(s.kindle.pulling){
    setDot('dot-kindle','ok');
    setDetail('detail-kindle','已连接，Kindle 正在拉取画面（'+(s.kindle.pull_ago!=null?s.kindle.pull_ago+' 秒前':'')+'）');
  }else if(s.kindle.ping && s.kindle.ssh){
    if(s.kindle.loop===false){ setDot('dot-kindle','wait'); setDetail('detail-kindle','SSH 正常，推送脚本未运行（点检测可启动）'); }
    else { setDot('dot-kindle','wait'); setDetail('detail-kindle','已连接，但未在拉帧（点检测连接）'); }
  }else if(!s.usbnet.configured){
    setDot('dot-kindle','bad'); setDetail('detail-kindle','等待 ② USB 网络配置');
  }else{
    setDot('dot-kindle','bad'); setDetail('detail-kindle','Kindle 不可达（'+s.kindle.ssh_err+'）');
  }
  // 照片缓存
  if(s.photo.cache_count>=10){
    setDot('dot-photo','ok');
    setDetail('detail-photo','本地缓存 '+s.photo.cache_count+' 张，进度 '+s.photo.photo_idx+'（NAS 关机时循环播放）');
  }else{
    setDot('dot-photo','wait');
    setDetail('detail-photo','缓存不足（'+s.photo.cache_count+' 张），挂载 NAS 后自动加载');
  }
  // 数据源
  const labels={weather:'天气',ccusage:'AI用量',codex_quota:'Codex额度',music:'音乐',reminders:'提醒',news:'资讯'};
  const grid=document.getElementById('src-grid'); grid.innerHTML='';
  Object.keys(labels).forEach(k=>{
    const d=document.createElement('div'); d.className='src-item';
    d.innerHTML='<span class="dot '+(s.sources[k]?'ok':'bad')+'"></span>'+labels[k];
    grid.appendChild(d);
  });
}
async function sysMountNas(){
  const btn=document.getElementById('btn-nas'); btn.disabled=true; const old=btn.textContent; btn.textContent='挂载中…';
  wMsg('正在挂载 NAS…','info');
  const r=await sysApi('/api/system/mount-nas',{method:'POST'});
  btn.disabled=false; btn.textContent=old;
  wMsg(r.msg, r.ok?'ok':'err');
  sysCheck();
}
async function sysSetupUsb(){
  const btn=document.getElementById('btn-usb'); btn.disabled=true; btn.textContent='等待授权…';
  wMsg('请在弹出的系统窗口输入开机密码以配置 USB 网络','info');
  const r=await sysApi('/api/system/setup-usbnet',{method:'POST'});
  btn.disabled=false; btn.textContent='配置 USB 网络';
  wMsg(r.msg, r.ok?'ok':'err');
  sysCheck();
}
async function sysTestKindle(){
  const btn=document.getElementById('btn-kindle'); btn.disabled=true; btn.textContent='检测中…';
  const r=await sysApi('/api/system/test-kindle',{method:'POST'});
  btn.disabled=false; btn.textContent='检测连接';
  wMsg(r.msg, r.ok?'ok':'err');
  sysCheck();
}
async function sysClearScreen(){
  const btn=document.getElementById('btn-clear'); btn.disabled=true; const old=btn.textContent; btn.textContent='清屏中…';
  wMsg('正在给 Kindle 下发清屏指令…','info');
  const r=await sysApi('/api/kindle/clear',{method:'POST'});
  btn.disabled=false; btn.textContent=old;
  wMsg(r.ok?'已下发，Kindle 将在下一次拉帧时清屏并继续轮播':'清屏指令下发失败：'+(r&&r.error||''), r.ok?'ok':'err');
}
async function sysRestartPhoto(){
  const btn=document.getElementById('btn-photo'); btn.disabled=true; btn.textContent='重新加载中…';
  const r=await sysApi('/api/system/restart-photo',{method:'POST'});
  btn.disabled=false; btn.textContent='重新加载';
  wMsg(r.msg||r.error, r.ok?'ok':'err');
  setTimeout(sysCheck, 3000);
}

init();
sysCheck();
setInterval(sysCheck, 15000);
</script>
</body>
